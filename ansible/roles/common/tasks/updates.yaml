---
- name: Configure automatic security updates without automatic reboots
  ansible.builtin.copy:
    content: |
      // Enable periodic metadata refresh and Ubuntu's unattended security updates.
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

      // Reboots are an explicit maintenance operation.
      Unattended-Upgrade::Automatic-Reboot "false";
    dest: /etc/apt/apt.conf.d/99-automatic-updates
    owner: root
    group: root
    mode: "0644"
