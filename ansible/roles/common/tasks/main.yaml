---
- name: Set the inventory hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  tags: [common_hostname]

- name: Install baseline packages
  ansible.builtin.import_tasks: packages.yaml
  tags: [common_packages]

- name: Configure the firewall
  ansible.builtin.import_tasks: firewall.yaml
  tags: [common_firewall]

- name: Configure automatic updates
  ansible.builtin.import_tasks: updates.yaml
  tags: [common_updates]

- name: Configure SSH
  ansible.builtin.import_tasks: ssh.yaml
  tags: [common_ssh]
