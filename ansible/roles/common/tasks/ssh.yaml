---
- name: Ensure the SSH drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure key-only SSH authentication
  ansible.builtin.copy:
    content: |
      # This is ordered before Ubuntu's optional SSH drop-ins because sshd uses
      # the first value it reads for these settings.
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitEmptyPasswords no
      PubkeyAuthentication yes
    dest: /etc/ssh/sshd_config.d/00-ssh-policy.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload SSH daemon

- name: Validate the complete SSH daemon configuration
  ansible.builtin.command:
    cmd: /usr/sbin/sshd -t
  changed_when: false
