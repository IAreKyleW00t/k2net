---
- name: Gather installed package facts
  ansible.builtin.package_facts:
    manager: auto
  tags: [common_firewall]

- name: Install baseline packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - fwupd
      - unattended-upgrades
      - ufw
    state: present
    update_cache: true
    cache_valid_time: 3600
