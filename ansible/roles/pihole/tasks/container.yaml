---
- name: Check whether the Docker socket exists
  ansible.builtin.stat:
    path: /var/run/docker.sock
  register: pihole_docker_socket

- name: Report deferred Pi-hole container reconciliation in check mode
  ansible.builtin.debug:
    msg: >-
      Ansible skips Pi-hole container changes in check mode
      when Docker is absent.
  when:
    - ansible_check_mode
    - not pihole_docker_socket.stat.exists

- name: Run the Pi-hole container
  community.docker.docker_container:
    name: "{{ pihole_container_name }}"
    image: "{{ pihole_container_image }}"
    state: started
    pull: missing
    restart_policy: unless-stopped
    comparisons:
      env: strict
    published_ports:
      - "{{ pihole_dns_port }}:53/tcp"
      - "{{ pihole_dns_port }}:53/udp"
      - "{{ pihole_http_port }}:80/tcp"
      - "{{ pihole_https_port }}:443/tcp"
    volumes:
      - "{{ pihole_persistent_root }}/etc-pihole:/etc/pihole"
    env:
      TZ: "{{ pihole_timezone }}"
      FTLCONF_dns_listeningMode: ALL
      FTLCONF_dns_upstreams: "{{ pihole_dns_servers | join(';') }}"
      FTLCONF_dns_hosts: "{{ pihole_custom_dns_records | join('\n') }}"
      FTLCONF_dns_cnameRecords: "{{ pihole_custom_cname_records | join(';') }}"
      FTLCONF_misc_dnsmasq_lines: >-
        {{ pihole_custom_dnsmasq_lines | join(';')
           if pihole_custom_dnsmasq_lines else omit }}
      PIHOLE_UID: "{{ pihole_uid | string }}"
      PIHOLE_GID: "{{ pihole_gid | string }}"
      FTLCONF_webserver_api_password: "{{ pihole_web_password }}"
  no_log: true
  when: not ansible_check_mode or pihole_docker_socket.stat.exists
