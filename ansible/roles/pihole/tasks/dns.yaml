---
- name: Check the system resolver configuration path
  ansible.builtin.stat:
    path: /etc/resolv.conf
  register: pihole_resolv_conf

- name: Gather installed package facts
  ansible.builtin.package_facts:
    manager: auto
  tags: [pihole_firewall]

- name: Gather system resolver service facts
  ansible.builtin.service_facts:

- name: Get the NetworkManager connection for the default interface
  ansible.builtin.command:
    argv:
      - nmcli
      - --get-values
      - GENERAL.CON-UUID
      - device
      - show
      - "{{ ansible_facts.default_ipv4.interface }}"
  register: pihole_networkmanager_connection
  changed_when: false
  check_mode: false

- name: Require an active NetworkManager connection
  ansible.builtin.assert:
    that: pihole_networkmanager_connection.stdout not in ['', '--']
    fail_msg: >-
      Pi-hole requires a NetworkManager connection on the default interface.

- name: Configure NetworkManager host DNS
  ansible.builtin.import_tasks: networkmanager.yaml
