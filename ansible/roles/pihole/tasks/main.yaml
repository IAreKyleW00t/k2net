---
- name: Check Pi-hole configuration
  ansible.builtin.import_tasks: preflight.yaml
  tags: [pihole_preflight]

- name: Create Pi-hole directories
  ansible.builtin.import_tasks: directories.yaml
  tags: [pihole_directories]

- name: Configure host DNS
  ansible.builtin.import_tasks: dns.yaml
  tags: [pihole_dns]

- name: Configure Pi-hole firewall rules
  ansible.builtin.import_tasks: firewall.yaml
  tags: [pihole_firewall]

- name: Run Pi-hole
  ansible.builtin.import_tasks: container.yaml
  tags: [pihole_container]

- name: Verify Pi-hole
  ansible.builtin.import_tasks: verify.yaml
  tags: [pihole_verify]
