---
- name: Require a NetworkManager-owned resolver without systemd-resolved
  ansible.builtin.assert:
    that:
      - pihole_resolv_conf.stat.isreg | default(false)
      - not (pihole_resolv_conf.stat.islnk | default(false))
      - >-
        ansible_facts.services.get(
          'systemd-resolved.service', {}).get('state', 'stopped') != 'running'
      - pihole_dns_servers | length > 0
      - >-
        pihole_dns_servers | select('match', '^[0-9]+(\.[0-9]+){3}$')
        | list | length == pihole_dns_servers | length
    fail_msg: >-
      NetworkManager host DNS requires a regular /etc/resolv.conf, no active
      systemd-resolved service, and at least one IPv4 upstream DNS server.

- name: Read the NetworkManager resolver configuration
  ansible.builtin.slurp:
    src: /etc/resolv.conf
  register: pihole_networkmanager_resolv_conf

- name: Verify NetworkManager owns the resolver configuration
  ansible.builtin.assert:
    that:
      - >-
        (pihole_networkmanager_resolv_conf.content | b64decode).startswith(
          '# Generated by NetworkManager')
    fail_msg: /etc/resolv.conf is not a NetworkManager-generated resolver file.

- name: Read NetworkManager DNS profile settings
  ansible.builtin.command:
    argv:
      - nmcli
      - --get-values
      - "{{ item }}"
      - connection
      - show
      - uuid
      - "{{ pihole_networkmanager_connection.stdout }}"
  loop:
    - ipv4.dns
    - ipv4.ignore-auto-dns
    - ipv6.ignore-auto-dns
    - ipv6.dns
  register: pihole_networkmanager_dns
  changed_when: false
  check_mode: false

- name: Reject existing static IPv6 DNS servers
  ansible.builtin.assert:
    that:
      - pihole_networkmanager_dns.results[3].stdout | trim == ''
    fail_msg: >-
      Review existing static IPv6 DNS servers before you configure host DNS.

- name: Configure independent NetworkManager host DNS
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - modify
      - uuid
      - "{{ pihole_networkmanager_connection.stdout }}"
      - ipv4.dns
      - "{{ pihole_dns_servers | join(',') }}"
      - ipv4.ignore-auto-dns
      - "yes"
      - ipv6.ignore-auto-dns
      - "yes"
  notify: Reapply Pi-hole NetworkManager DNS
  changed_when: true
  when:
    - not ansible_check_mode
    - >-
      (pihole_networkmanager_dns.results[0].stdout | trim | split(',')
       | map('trim') | list != pihole_dns_servers) or
      (pihole_networkmanager_dns.results[1].stdout | trim != 'yes') or
      (pihole_networkmanager_dns.results[2].stdout | trim != 'yes')

- name: Apply NetworkManager host DNS before starting Pi-hole
  ansible.builtin.meta: flush_handlers
  when: not ansible_check_mode

- name: Report deferred NetworkManager DNS changes in check mode
  ansible.builtin.debug:
    msg: Ansible skips changes to NetworkManager host DNS in check mode.
  when: ansible_check_mode
